<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust is Invisible — ProductCampRTP™</title>
<link rel="icon" href="favicon.ico" sizes="48x64">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#F6F4EF; --card:#F8F6F1;
  --ink:#1F1D18; --ink-dim:#55524A; --ink-faint:#8B867B;
  --yellow:#C79006; --red:#D64533; --green:#4E8A3C; --blue:#3B7DBF;
  --border:rgba(31,29,24,.14);
  --font-display:'Noto Sans',sans-serif; --font-body:'Noto Sans',sans-serif; --font-label:'Noto Sans',sans-serif; --font-title:'Noto Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}

/* ---------- TOP BAR ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
#deck-logo{height:26px;width:auto;display:block}
#ticks{flex:1;display:flex;gap:7px;align-items:center;height:100%;justify-content:center}
/* slide navigator: circles — selected = gray fill, all others = outline */
.tick{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:transparent;border:1.5px solid rgba(31,29,24,.45);cursor:pointer;transition:background .18s,border-color .18s,transform .18s;padding:0;position:relative}
/* invisible padded hit target: a 9px circle is too small to tap/click accurately */
.tick::after{content:'';position:absolute;inset:-5px;border-radius:50%}
.tick:hover{border-color:rgba(31,29,24,.85);background:rgba(31,29,24,.14)}
.tick.past{border-color:rgba(31,29,24,.45)}
.tick.current{background:var(--ink-dim);border-color:var(--ink-dim);transform:scale(1.25)}
.tick.current:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* hover/focus tooltip for the dot navigator */
#tickTip{position:fixed;top:58px;left:-9999px;z-index:150;background:rgba(31,29,24,.95);color:#FFFFFF;font-family:var(--font-label);font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:7px 12px;border-radius:8px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translate(-50%,-4px);transition:opacity .15s,transform .15s;pointer-events:none}
#tickTip.show{opacity:1;transform:translate(-50%,0)}
#counter{font-family:var(--font-label);font-size:12px;font-weight:600;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
#counter b{color:var(--yellow);font-size:15px}

/* ---------- PEPPER MARK (on-slide, top-left, across the deck) ---------- */
#pepper{position:fixed;top:64px;left:22px;z-index:90;width:clamp(64px,7vw,104px);pointer-events:none;user-select:none}
#pepper img{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(31,29,24,.12))}
@media (max-width:640px){#pepper{top:60px;left:12px;width:56px}}

/* ---------- TALK TITLE (on-slide, top-right, across the deck) ---------- */
#talk-title{position:fixed;top:64px;right:28px;z-index:90;pointer-events:none;user-select:none;
  text-align:right;font-family:var(--font-label);text-transform:uppercase;line-height:1.3}
#talk-title .line{display:block;font-size:clamp(16px,1.6vw,26px);font-weight:700;letter-spacing:.1em;color:var(--ink)}
#talk-title .line em{font-style:normal;color:var(--ink)}
#talk-title .rule{display:block;width:85px;height:3px;background:var(--ink);margin:8px 0 0 auto}
@media (max-width:640px){#talk-title{top:58px;right:14px}#talk-title .line{font-size:15px;letter-spacing:.08em}
  #talk-title .rule{width:70px;height:2px;margin-top:7px}}

/* ---------- FIVE STEPS carousel (slide 13): each advance click reveals the next
   sketch; revealed cards sit on a ring around the latest (center), earlier ones
   trail left and wrap to the right once the ring closes ---------- */
.slide.steps5 .s5-rail{position:relative;width:min(1240px,94vw);height:min(44vh,400px);margin-top:1vh}
.slide.steps5 .s5-wire{position:absolute;left:4%;right:4%;top:46%;height:2px;background:rgba(31,29,24,.14)}
.slide.steps5 .s5-card{position:absolute;left:50%;top:44%;width:min(280px,24vw);margin:0;text-align:center;
  transition:transform .55s cubic-bezier(.45,.05,.25,1),opacity .55s ease}
.slide.steps5 .s5-card img{width:100%;height:auto;display:block}
.slide.steps5 .s5-card.pos-c img{filter:drop-shadow(0 12px 28px rgba(31,29,24,.15))}
.slide.steps5 .s5-card .tag{display:block;margin-top:10px;font-size:clamp(11px,1.15vw,15px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.slide.steps5 .s5-card .tag b{color:var(--yellow)}
.slide.steps5 .s5-card .hint{margin-top:3px;font-size:12.5px;color:var(--ink-dim)}
.slide.steps5 .s5-card:not(.in){opacity:0;pointer-events:none}
.slide.steps5 .s5-card.pos-c{transform:translate(-50%,-50%) scale(1);z-index:5}
.slide.steps5 .s5-card.pos-l1{transform:translate(calc(-50% - var(--s5x,300px)),-50%) scale(.62);opacity:.55;z-index:3;filter:grayscale(1) contrast(.92)}
.slide.steps5 .s5-card.pos-l2{transform:translate(calc(-50% - var(--s5x2,520px)),-50%) scale(.45);opacity:.28;z-index:2;filter:grayscale(1) contrast(.92)}
.slide.steps5 .s5-card.pos-r1{transform:translate(calc(-50% + var(--s5x,300px)),-50%) scale(.62);opacity:.55;z-index:3;filter:grayscale(1) contrast(.92)}
.slide.steps5 .s5-card.pos-r2{transform:translate(calc(-50% + var(--s5x2,520px)),-50%) scale(.45);opacity:.28;z-index:2;filter:grayscale(1) contrast(.92)}
@media (prefers-reduced-motion: reduce){ .slide.steps5 .s5-card{transition:none} }
@media (max-width:640px){
  .slide.steps5 .s5-rail{height:34vh;--s5x:120px;--s5x2:210px}
  .slide.steps5 .s5-card{width:min(190px,42vw)}
  .slide.steps5 .s5-card .tag{white-space:normal}
  .slide.steps5 .s5-card .hint{font-size:11px}
}

/* ---------- STAGE ---------- */
#stage{position:absolute;inset:52px 0 0 0;overflow:hidden}
.slide{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:96px clamp(24px,6vw,96px) 72px;
  opacity:0;transition:opacity .4s ease}
.slide.active{display:block;opacity:1}
.slide.leaving{display:block;opacity:0}
@media (prefers-reduced-motion: reduce){
  .slide,.slide.leaving{transition:none}
}
.slide-inner{max-width:900px;margin:0 auto;position:relative}
.slide .slide-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 220px);max-width:none}
.slide.media h2.display{font-size:clamp(32px,4.4vw,64px);margin-bottom:12px}
.slide.media .media-row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,1.8vw,28px);width:100%;padding:0 clamp(24px,5vw,80px);margin-top:.5vh;min-height:0}
.slide.media .slide-media{flex:0 1 auto;min-width:0;height:min(58vh,calc(100vh - 480px));width:auto;max-width:44%;object-fit:contain;display:block}
.media-fig{position:relative;margin:0;display:flex;min-width:0}
.slide.media .media-fig .slide-media{max-width:100%}
.media-credit{position:absolute;top:100%;left:0;margin-top:8px;font-size:11px;color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap;text-align:left}
.slide.media img.delayed-media{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.slide.active img.delayed-media.revealed{opacity:1;transform:none}
/* caption below the two images: one line after another */
.media-caption{display:flex;flex-direction:column;align-items:center;gap:.1em;margin-top:0;font-family:var(--font-title);font-weight:400;font-size:clamp(18px,2vw,26px);line-height:1.3;color:var(--ink);text-align:center}
.media-caption .cap-line:nth-child(2){font-weight:700}
@media (prefers-reduced-motion:reduce){.slide.media img.delayed-media{opacity:1;transform:none;transition:none}}
.eyebrow{font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);margin-bottom:18px;display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:0 0 48px;height:1px;background:rgba(199,144,6,.5)}
/* Slide 1 (cover): display treatment; h1 elsewhere uses --font-display */
h1.display{font-family:var(--font-display);font-weight:700;font-size:clamp(44px,7vw,110px);line-height:1.15;margin-bottom:28px}
.slide:first-child h1.display{font-family:var(--font-title);font-weight:700;text-transform:uppercase;color:var(--ink);font-size:clamp(30px,5.6vw,124px);line-height:1.18;letter-spacing:-.02em;transform:rotate(-1.2deg);transform-origin:center;margin-bottom:3vh;text-align:center;white-space:nowrap}
.slide:first-child .hl{color:var(--yellow);position:relative;display:inline-block;padding:.12em .3em .08em;transform:rotate(.7deg);font-size:.88em}
.slide:first-child .hl .hl-box{position:absolute;left:-.06em;top:-.12em;bottom:auto;width:calc(100% + .12em);height:calc(100% + .24em);overflow:visible}
.slide:first-child .eyebrow, .slide:first-child .lede{font-family:var(--font-title)}
.slide:first-child .eyebrow{font-weight:700;justify-content:center;font-size:clamp(12px,1.3vw,18px)}
.slide:first-child .eyebrow::before{content:"";flex:0 0 48px;height:1px;background:rgba(199,144,6,.5)}
.slide:first-child .lede{font-weight:400}
/* Cover title: black "Nobody" (strike removed), black "Your AI", no underline */
.slide:first-child h1.display .neg{color:var(--ink)}
/* "Your AI": plain black, no underline */
.slide:first-child h1.display .em{font-style:normal;color:var(--ink);display:inline}

.slide:first-child .slide-inner{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 220px)}
@supports not (-webkit-text-stroke: 1px black){
  .slide:first-child h1.display{color:var(--ink)}
  .slide:first-child .hl{color:var(--yellow)}
}
h2.display{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,4.2vw,60px);line-height:1.22;margin-bottom:24px}
/* long titles: break into two centered lines via .l2 */
.slide h2.display .l2{display:block}
/* image under a title slide */
.slide .title-fig{display:flex;justify-content:center;margin-top:1vh;min-height:0}
.slide .title-fig img{height:min(42vh,calc(100vh - 380px));width:auto;max-width:70%;object-fit:contain;display:block}
/* statement slides carry wide strip sketches (e.g. the racing car, aspect 3.95):
   height-sizing letterboxes them — size by width instead, keep a height guard */
.slide.statement .title-fig img{height:auto;width:min(38.4%,528px);max-height:min(24vh,calc(100vh - 420px));object-fit:contain}
.underline-svg{display:block;width:min(340px,70%);height:16px;margin:-14px 0 30px;overflow:visible}
.lede{font-size:clamp(18px,2.1vw,23px);color:var(--ink-dim);max-width:660px;margin-bottom:36px}
.lede b,.lede strong{color:var(--ink);font-weight:600}
.body-copy{max-width:640px;color:var(--ink-dim);font-size:17px;margin-bottom:24px}
.body-copy b{color:var(--ink)}
.sketch{margin:34px 0 10px;padding:36px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;justify-content:center}
.sketch svg{max-width:100%;height:auto}
.sketch-caption{font-family:var(--font-display);font-style:normal;font-size:16px;color:var(--ink-faint);text-align:center;margin:14px 0 8px}
.trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:34px 0}
.trust-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 18px;transition:border-color .2s,transform .2s}
.trust-card:hover{border-color:rgba(199,144,6,.6);transform:translateY(-3px)}
.trust-card .letter{font-family:var(--font-display);font-weight:700;font-size:36px;color:var(--yellow);line-height:1;margin-bottom:10px}
.trust-card .name{font-family:var(--font-label);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.trust-card .desc{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.spec-table{width:100%;border-collapse:collapse;margin:26px 0;font-size:13.5px;line-height:1.5}
.spec-table th{font-family:var(--font-label);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
.spec-table td{padding:12px 14px;border-bottom:1px solid rgba(31,29,24,.08);color:var(--ink-dim);vertical-align:top}
.spec-table td:first-child{font-family:var(--font-title);font-weight:700;font-size:15px;color:var(--yellow);white-space:nowrap}
.spec-table td:nth-child(2){color:var(--ink);font-weight:500}
.cite{font-size:12px;color:var(--ink-faint);border-left:2px solid rgba(199,144,6,.45);padding-left:14px;margin:14px 0 8px}
.divider-num{font-family:var(--font-title);font-weight:700;font-size:clamp(80px,12vw,160px);font-weight:600;color:transparent;-webkit-text-stroke:1px rgba(199,144,6,.5);line-height:1;margin-bottom:14px}
.big-quote{font-family:var(--font-display);font-style:normal;font-weight:600;font-size:clamp(24px,3vw,36px);color:var(--ink);line-height:1.3;max-width:720px;margin:30px 0;border-left:3px solid var(--yellow);padding-left:26px}
.stat-row{display:flex;gap:40px;flex-wrap:wrap;margin:30px 0}
.stat .n{font-family:var(--font-display);font-weight:700;font-size:44px;color:var(--yellow);line-height:1}
.stat .l{font-family:var(--font-label);font-size:12px;color:var(--ink-dim);max-width:180px;margin-top:6px}

/* ---------- GLOBAL CENTER ALIGNMENT ---------- */
.slide .eyebrow{justify-content:center}
.slide .eyebrow::before{content:"";flex:0 0 48px;height:1px;background:rgba(199,144,6,.5)}
.slide h1.display,.slide h2.display{text-align:center}
.slide .lede,.slide .body-copy,.slide .big-quote,.slide .cite{text-align:center;margin-left:auto;margin-right:auto}
.slide .stat-row{justify-content:center;text-align:center}
.slide .spec-table th,.slide .spec-table td{text-align:center}
.slide .trust-card{text-align:center}

/* SLIDE 2+: click-driven reveal + single-image slides + big statement slides */
.slide.single{padding-bottom:40px}
.slide.single .slide-inner{min-height:calc(100vh - 220px)}
.slide.single .media-row{padding:0;margin-top:0;flex-direction:column;gap:0}
.slide.single .media-source{margin-top:12px}
.slide.single .slide-media{height:min(65vh,calc(100vh - 320px));max-width:88%}
.slide[data-idx="3"] .slide-media{width:auto;height:auto;max-width:min(75vw,1080px);max-height:min(65vh,calc(100vh - 320px))} /* slide 4: flying-character tweet — taller 3:2 composition; dual max-caps keep aspect, height binds on desktop, width on mobile */
@media (min-width:701px){
  .slide[data-idx="3"] .slide-media{position:relative;top:-4vh} /* center the tweet on the fixed prev/next arrow line (top:50%) — measured 38px low at 900px tall */
}
.slide h2.display.statement{font-size:clamp(44px,6.5vw,100px);font-weight:700;line-height:1.15;text-align:center;max-width:16ch;margin:0 auto}
.slide h2.display.statement .l2{display:block}
.slide h2.display.delayed-text{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
.slide.active h2.display.delayed-text.revealed{opacity:1;transform:none}

/* ---------- TITLE ENTRANCE: slide-up + left-to-right unmask ---------- */
/* Keyframes (not transitions) so the animation restarts on every display:none -> block toggle. */
@keyframes title-in{
  0%{opacity:0;transform:translateY(20px);clip-path:inset(0 100% 0 0)}
  45%{opacity:1}
  100%{opacity:1;transform:translateY(0);clip-path:inset(0 -2% 0 0)}
}
.slide h1.display,.slide h2.display{
  animation:title-in .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:.15s}
/* Cover title keeps its -1.2deg tilt: dedicated keyframe so the animation doesn't flatten it */
@keyframes title-in-cover{
  0%{opacity:0;transform:translateY(20px) rotate(-1.2deg);clip-path:inset(0 100% 0 0)}
  45%{opacity:1}
  100%{opacity:1;transform:rotate(-1.2deg);clip-path:inset(0 -2% 0 0)}
}
.slide:first-child h1.display{animation-name:title-in-cover}
/* ---------- CONTENT STAGGER: content arrives after the title finishes ---------- */
/* Title runs .15s delay + .6s = done ~.75s; content starts .85s, secondary items trail. */
@keyframes fx-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide .fx-t{animation:fx-up .5s ease both;animation-delay:.15s}
.slide .fx{animation:fx-up .5s ease both;animation-delay:.85s}
.slide .fx2{animation:fx-up .5s ease both;animation-delay:1.05s}
.slide .fx-lead{animation:fx-up .5s ease both;animation-delay:.2s}
/* Centered text needs width:100% or clip-path inset from the right has nothing to clip against */
.slide h2.display.statement{width:100%}
/* Click-reveal titles keep their staged behavior; add only the unmask on reveal */
.slide h2.display.delayed-text{animation:none;opacity:0;transform:translateY(12px);
  transition:opacity .6s ease,transform .6s ease,clip-path .5s cubic-bezier(.22,.61,.36,1);clip-path:inset(0 100% 0 0)}
.slide.active h2.display.delayed-text.revealed{opacity:1;transform:none;clip-path:inset(0 -2% 0 0)}
@media (prefers-reduced-motion:reduce){
  .slide.media img.delayed-media,.slide h2.display.delayed-text{opacity:1;transform:none;transition:none}
  .slide h1.display,.slide h2.display{animation:none;clip-path:none}
  .slide .fx-t,.slide .fx,.slide .fx2,.slide .fx-lead{animation:none}
}

/* ---------- ANNOTATION ---------- */
.anno-canvas{position:absolute;top:0;left:0;z-index:50;display:none;cursor:crosshair;touch-action:none}
body.annotate-mode .slide.active .anno-canvas{display:block}
body.annotate-mode{user-select:none}

/* ---------- TOOLBAR ---------- */
#toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:16px;padding:8px 10px;box-shadow:0 12px 32px rgba(31,29,24,.18)}
.tbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;
  color:var(--ink-dim);cursor:pointer;font-size:16px;transition:background .15s,color .15s}
.tbtn .pi{width:18px;height:18px;flex:none;fill:currentColor}
.tbtn .pi-16{width:16px;height:16px}
.tbtn .pi-14{width:14px;height:14px}
.tbtn:hover{background:rgba(31,29,24,.07);color:var(--ink)}
.tbtn.active{background:var(--yellow);color:#FFFFFF}
.tbtn:disabled{opacity:.3;cursor:default}
.tsep{width:1px;height:24px;background:var(--border);margin:0 4px}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s,border-color .15s;flex:none}
.swatch.active{border-color:var(--ink);transform:scale(1.15)}
.sw-pen{background:var(--yellow)}.sw-red{background:var(--red)}.sw-green{background:var(--green)}.sw-blue{background:var(--blue)}
#btnAnnotate{width:auto;padding:0 14px;gap:7px;font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
#btnCards{width:auto;padding:0 12px;gap:7px;font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
#sizePop{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.98);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;display:none;align-items:center;gap:10px;white-space:nowrap}
#sizePop.show{display:flex}
#sizePop input{width:110px;accent-color:var(--yellow)}
#sizeVal{font-size:11px;color:var(--ink-dim);font-family:var(--font-label);min-width:26px}

/* ---------- SLIDE 8: two public-facing AI exhibits + linked reflection cards ---------- */
.slide.media-pair .media-row{display:flex;align-items:flex-start;gap:clamp(18px,2.4vw,40px)}
.slide.media-pair .media-fig{flex:1 1 0;min-width:0;flex-direction:column;align-items:center}
.slide.media-pair .imgwrap{position:relative;line-height:0;margin-top:64px}
.slide.media-pair .slide-media{height:auto;max-height:min(46vh,calc(100vh - 600px));width:auto;max-width:100%;border-radius:10px;border:1px solid var(--border);box-shadow:0 10px 28px rgba(31,29,24,.10)}
.slide.media-pair .media-credit{position:static;margin-top:12px;text-align:center;white-space:normal;font-size:13px;color:var(--ink-dim);max-width:34ch;line-height:1.5}
.slide.media-pair .media-credit b{color:var(--ink);font-weight:600}
.slide.media-pair h2.display{margin-bottom:8px}
.slide.media-pair .pair-sub{margin-bottom:1vh}

/* image + label link out to the source post (slide 8 single, slide 9 pair) */

.slide a.media-link .slide-media{transition:transform .18s,box-shadow .18s}
.slide a.media-link:hover .slide-media,.slide a.media-link:focus-visible .slide-media{transform:translateY(-2px);box-shadow:0 14px 36px rgba(31,29,24,.20)}

.slide .media-source{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-dim);
  text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:1px;transition:color .15s,border-color .15s}

/* big yellow ? hotspot, anchored on the baked-in label chip (percentages of the image) */
.hotspot{position:absolute;width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;
  background:var(--yellow);color:#FFFFFF;font-size:30px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(199,144,6,.55);
  transition:transform .18s,box-shadow .18s;transform:translate(-50%,-50%);z-index:20}
.hotspot:hover,.hotspot:focus-visible{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 26px rgba(199,144,6,.7);outline:none}
.hotspot::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(199,144,6,.5);
  animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}70%{transform:scale(1.3);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hotspot::after{animation:none}}

/* the incoming reflection card */
.link-card{position:absolute;z-index:40;width:min(300px,42vw);background:#FFFFFF;border:1px solid var(--border);
  border-radius:12px;padding:16px 18px 12px;box-shadow:0 14px 34px rgba(31,29,24,.2);
  /* explicit line-height: cards live inside .imgwrap (line-height:0), without this
     the .num/.theme label lines collapse onto each other (count over heading) */
  line-height:1.4;
  transform:rotate(-1.1deg);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.link-card.show{opacity:1;pointer-events:auto;transform:rotate(-1.1deg) translateY(0)}
.link-card.hide-down{transform:rotate(-1.1deg) translateY(10px)}
.link-card .num{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:3px}
.link-card .theme{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px}
.link-card .q{font-size:15px;font-weight:600;line-height:1.38;color:var(--ink);margin-bottom:10px}
.link-card .close{position:absolute;top:8px;right:10px;border:none;background:none;color:var(--ink-faint);
  font-size:16px;cursor:pointer;padding:4px;line-height:1}
.link-card .close:hover{color:var(--ink)}
.link-card .fix{border-top:1px dashed var(--border);padding-top:8px;font-size:12px;color:var(--ink-dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.link-card .fix b{color:var(--green);font-weight:700;letter-spacing:.06em;font-size:10px;text-transform:uppercase;margin-right:6px}

/* red dotted wire, halo underneath so it reads over the busy screenshot */
#wires8{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:35;overflow:visible}
#wires8 path{fill:none;stroke-linecap:round}
#wires8 path.halo{stroke:rgba(255,255,255,.92);stroke-width:7}
#wires8 path.main{stroke:var(--red);stroke-width:3;stroke-dasharray:2 9}

  transition:opacity .5s,transform .5s;font-size:clamp(16px,1.8vw,21px);font-weight:600}

  .link-card.show{transform:translateX(-50%)}

/* chain slide: linked reflection cards — hotspot + dotted wire, same treatment
   as slide 8's media-pair: the card floats outside its tile, a red dotted wire

.slide.chain-slide .step{overflow:visible}

   step 04 carries TWO hotspots side by side — Human Control + Recovery */

.stx-head{display:flex;flex-direction:column;align-items:flex-start;text-align:left;margin-bottom:6px}
.stx-head .eyebrow{justify-content:flex-start;margin-bottom:4px!important}
.slide.cs.stx .stx-head h2.display{font-size:clamp(26px,2.6vw,38px);line-height:1.15;margin:0;text-align:left;white-space:normal}
.stx-grid{display:grid;grid-template-columns:minmax(340px,390px) 1fr;gap:clamp(28px,3vw,52px);align-items:start;width:100%}
.stx-left{display:flex;flex-direction:column;gap:10px;text-align:left}
.stx-sketch{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(31,29,24,.08);line-height:0}
.stx-sketch img{width:100%;height:auto;max-height:min(17vh,150px);object-fit:contain;display:block;border-radius:6px}
.stx-sub{margin-top:4px;line-height:1.2}
.stx-sub b{display:block;font-size:clamp(15px,1.3vw,18px);color:var(--ink)}
.stx-why{display:flex;flex-direction:column;gap:6px}
.stx-why>div{position:relative;padding:6px 12px 6px 38px;background:var(--card);border:1px solid var(--border);border-radius:12px;line-height:1.28;cursor:pointer;color:var(--ink-dim);font-size:clamp(12px,1.05vw,14px);transition:border-color .2s,transform .2s,box-shadow .2s}
.stx-why>div:hover,.stx-why>div.lit{border-color:rgba(199,144,6,.6);transform:translateY(-2px);box-shadow:0 12px 26px rgba(31,29,24,.12)}
.stx-why .n{position:absolute;left:10px;top:8px;width:21px;height:21px;border-radius:50%;background:var(--yellow);color:#fff;font-size:11px;font-weight:700;line-height:21px;text-align:center}
.stx-why b{display:block;color:var(--ink);font-size:clamp(13px,1.15vw,15.5px)}
.stx-why em{display:block;font-style:normal;font-size:clamp(11.5px,.95vw,13px);line-height:1.3;color:var(--ink-dim)}
.stx-why .card{display:inline-block;margin-top:1px;font-size:10.5px;font-weight:600;color:var(--green)}
.stx-why .card::before{content:"";display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20256%20256%27%3E%3Cpath%20d%3D%27M239.43%2C133l-32-80h0a8%2C8%2C0%2C0%2C0-9.16-4.84L136%2C62V40a8%2C8%2C0%2C0%2C0-16%2C0V65.58L54.26%2C80.19A8%2C8%2C0%2C0%2C0%2C48.57%2C85h0v.06L16.57%2C165a7.92%2C7.92%2C0%2C0%2C0-.57%2C3c0%2C23.31%2C24.54%2C32%2C40%2C32s40-8.69%2C40-32a7.92%2C7.92%2C0%2C0%2C0-.57-3L66.92%2C93.77%2C120%2C82V208H104a8%2C8%2C0%2C0%2C0%2C0%2C16h48a8%2C8%2C0%2C0%2C0%2C0-16H136V78.42L187%2C67.1%2C160.57%2C133a7.92%2C7.92%2C0%2C0%2C0-.57%2C3c0%2C23.31%2C24.54%2C32%2C40%2C32s40-8.69%2C40-32A7.92%2C7.92%2C0%2C0%2C0%2C239.43%2C133ZM56%2C184c-7.53%2C0-22.76-3.61-23.93-14.64L56%2C109.54l23.93%2C59.82C78.76%2C180.39%2C63.53%2C184%2C56%2C184Zm144-32c-7.53%2C0-22.76-3.61-23.93-14.64L200%2C77.54l23.93%2C59.82C222.76%2C148.39%2C207.53%2C152%2C200%2C152Z%27/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20256%20256%27%3E%3Cpath%20d%3D%27M239.43%2C133l-32-80h0a8%2C8%2C0%2C0%2C0-9.16-4.84L136%2C62V40a8%2C8%2C0%2C0%2C0-16%2C0V65.58L54.26%2C80.19A8%2C8%2C0%2C0%2C0%2C48.57%2C85h0v.06L16.57%2C165a7.92%2C7.92%2C0%2C0%2C0-.57%2C3c0%2C23.31%2C24.54%2C32%2C40%2C32s40-8.69%2C40-32a7.92%2C7.92%2C0%2C0%2C0-.57-3L66.92%2C93.77%2C120%2C82V208H104a8%2C8%2C0%2C0%2C0%2C0%2C16h48a8%2C8%2C0%2C0%2C0%2C0-16H136V78.42L187%2C67.1%2C160.57%2C133a7.92%2C7.92%2C0%2C0%2C0-.57%2C3c0%2C23.31%2C24.54%2C32%2C40%2C32s40-8.69%2C40-32A7.92%2C7.92%2C0%2C0%2C0%2C239.43%2C133ZM56%2C184c-7.53%2C0-22.76-3.61-23.93-14.64L56%2C109.54l23.93%2C59.82C78.76%2C180.39%2C63.53%2C184%2C56%2C184Zm144-32c-7.53%2C0-22.76-3.61-23.93-14.64L200%2C77.54l23.93%2C59.82C222.76%2C148.39%2C207.53%2C152%2C200%2C152Z%27/%3E%3C/svg%3E") center/contain no-repeat}
.stx-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.stx-chips .lab{font-size:12px;font-weight:600;color:var(--ink-dim);margin-right:4px}
.stx-chip{font-size:12px;font-weight:600;background:rgba(199,144,6,.16);color:var(--ink);padding:4px 11px;border-radius:999px}
.stx-right{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.stx-frame{display:none}.stx-frame.on{display:block}
.stx-role{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stx-role .rp{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.stx-role .rt{font-size:clamp(13px,1.15vw,16px);color:var(--ink);line-height:1.3;flex:1 1 0;min-width:0}
.stx-stage{position:relative;width:min(100%,calc((100vh - 390px)*var(--ar)))}
.stx-stage::before{content:"";display:block;padding-top:calc(100% / var(--ar))}
.stx-shot{position:absolute;left:0;top:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);box-shadow:0 10px 28px rgba(31,29,24,.12);line-height:0;background:#fff}
.stx-shot img{display:block;width:100%;height:auto}
.stx-hole{position:absolute;border:2px dashed rgba(199,144,6,.85);border-radius:6px;box-shadow:0 0 0 3000px rgba(250,249,247,.55);pointer-events:none}
.stx-lens{position:absolute;border-radius:12px;overflow:hidden;border:2px solid var(--yellow);box-shadow:0 20px 44px rgba(31,29,24,.24);background:#fff;line-height:0}
.stx-lens img{display:block;width:100%;height:auto}
.stx-stage .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--yellow);color:#fff;font-size:12.5px;font-weight:700;line-height:26px;text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 2px 8px rgba(0,0,0,.25);z-index:6;cursor:pointer;transition:transform .18s,box-shadow .18s}
.stx-stage .pin:hover,.stx-stage .pin.lit{transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 8px 26px rgba(199,144,6,.7)}
.stx-tip{position:absolute;z-index:8;width:min(280px,28vw);background:var(--ink);color:#fff;font-size:12.5px;line-height:1.38;padding:10px 12px;border-radius:10px;box-shadow:0 14px 30px rgba(31,29,24,.25);display:none;text-align:left;transform:translate(calc(-100% - 22px),-50%)}
.stx-tip.r{transform:translate(22px,-50%)}
.stx-tip.u{transform:translate(-50%,calc(-100% - 22px))}
.stx-tip.ul{transform:translate(-18px,calc(-100% - 22px))}
.stx-tip.ur{transform:translate(calc(-100% + 18px),calc(-100% - 22px))}
.stx-tip.on{display:block}
.stx-tip b{display:block;font-size:13.5px;margin-bottom:2px;color:#fff}
.stx-tip .card{display:block;margin-top:5px;font-size:11px;font-weight:600;color:var(--yellow)}
.stx-cap{font-size:clamp(12px,1.02vw,13.5px);color:var(--ink-dim);line-height:1.4;margin:10px 0 0}
.stx-cap b{color:var(--ink)}
.stx-dots{display:flex;gap:8px;justify-content:flex-start;align-items:center;line-height:1;margin-top:6px}
.stx-dots i{width:8px;height:8px;border-radius:50%;background:rgba(31,29,24,.2);display:block;cursor:pointer}
.stx-dots i.on{background:var(--yellow)}
.stx-nav{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;border:0;font-size:17px;line-height:28px;text-align:center;cursor:pointer;padding:0;font-family:inherit}
.stx-ph{display:flex;align-items:center;justify-content:center;text-align:center;min-height:min(56vh,540px);border:2px dashed rgba(31,29,24,.18);border-radius:12px;background:rgba(255,255,255,.6);color:var(--ink-dim);font-size:clamp(13px,1.15vw,16px);line-height:1.45;padding:24px}
.stx-ph b{display:block;color:var(--ink);font-size:clamp(15px,1.4vw,19px);margin-bottom:6px}
@media (max-width:900px){.stx-grid{grid-template-columns:1fr}.stx-stage{width:100%}}
.slide.cs.stx{padding-top:40px!important}
.stx-headrow{margin-bottom:6px!important}

/* ===== framework: centred, fixed left column, shared screen size ===== */
.slide.cs.stx .slide-inner{align-items:center!important;max-width:none!important}
.slide.cs.stx .stx-headrow,.slide.cs.stx .stx-grid{width:calc(390px + 48px + var(--stw,700px))!important;max-width:none}
.slide.cs.stx .stx-grid{grid-template-columns:390px var(--stw,700px)!important;gap:48px!important}
.slide.cs.stx .stx-head .eyebrow{display:none!important}
.rl-tabs,.s2-scn{height:58px;box-sizing:border-box}
.rl-tabs{margin-bottom:10px!important}
.rl-tab{align-items:center}
.rl-tab span span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ===== spacing pass ===== */
.slide.cs.stx{padding-top:64px!important;padding-bottom:120px!important}
.slide.cs.stx .stx-headrow,.slide.cs.stx .stx-grid{width:calc(390px + 80px + var(--stw,700px))!important}
.slide.cs.stx .stx-grid{gap:80px!important}
.slide.cs.stx .stx-head h2.display{font-size:clamp(22px,1.9vw,30px)!important;line-height:1.2!important;margin:0!important}
.slide.cs.stx .stx-headrow{margin-bottom:14px!important}
body.stx-on #pepper{top:84px;width:clamp(56px,5.6vw,84px)}
body.stx-on #talk-title{top:84px}
body.stx-on #talk-title .line{font-size:clamp(14px,1.3vw,20px)}
.slide.cs.stx .stx-sketch img{max-height:min(13vh,140px)}
.slide.cs.stx .stx-left{gap:8px}
.slide.cs.stx .stx-sub b{font-size:clamp(14px,1.15vw,17px)}
.slide.cs.stx .stx-why{gap:5px}
.slide.cs.stx .stx-why>div{padding:5px 12px 5px 38px}
.slide.cs.stx .stx-why b{font-size:clamp(13px,1.05vw,15px)}
.slide.cs.stx .stx-why em{font-size:clamp(11.5px,.88vw,13px);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide.cs.stx .stx-why .n{top:7px}
/* ===== attribute cards = the one annotation style ===== */
.slide.cs.stx .stx-why{gap:10px}
.slide.cs.stx .stx-why>div,.slide.s2s .stx-why>div,.slide.pxs .stx-why>div{opacity:1!important;background:#fff;border:1.5px solid #e2dfd8;border-radius:12px;padding:9px 14px 9px 42px;box-shadow:none;transform:none!important}
.slide.cs.stx .stx-why>div:hover{border-color:#cfcabd;background:#fdfcf9}
.slide.cs.stx .stx-why>div.on{background:#fbf4e3!important;border-color:var(--yellow)!important;box-shadow:0 10px 24px rgba(199,144,6,.16)!important}
.slide.cs.stx .stx-why>div.lit:not(.on){border-color:rgba(199,144,6,.55)}
.slide.cs.stx .stx-why .n{top:10px;left:12px;background:#c8c3b6}
.slide.cs.stx .stx-why>div.on .n{background:var(--yellow)}
.stx-why .xp{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed rgba(199,144,6,.55)}
.stx-why>div.on .xp{display:block}
.stx-why>div.on em{display:none}
.stx-why .xp b{display:block;font-size:clamp(13.5px,1.08vw,15.5px);color:var(--ink);margin-bottom:2px}
.stx-why .xp p{margin:0 0 4px;font-size:clamp(12.5px,.98vw,14px);line-height:1.42;color:var(--ink-dim)}
.stx-why .xp i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.slide.cs.stx .stx-sketch img{max-height:min(11.5vh,124px)}
.slide.cs.stx .stx-why>div.on>em{display:none!important}
.slide.cs.stx .stx-why>div.on>.card{display:none}
.slide.cs.stx .stx-why .xp i::before{content:"";display:inline-block;width:0}
.slide.cs.stx .stx-why{gap:8px}
.slide.cs.stx .stx-left{gap:8px}
/* compact: unselected = title + principle; selected = description + explanation */
.slide.cs.stx .stx-why>div>em{display:none!important}
.slide.cs.stx .stx-why>div.on>em{display:block!important;-webkit-line-clamp:unset}
.slide.cs.stx .stx-why>div>.card{display:inline-block!important;margin-top:1px}
.slide.cs.stx .stx-why>div.on>.card{display:none!important}
.slide.cs.stx .stx-why>div{padding:8px 14px 8px 42px}
.slide.cs.stx .stx-why .n{top:9px}
.slide.cs.stx .stx-sketch img{max-height:min(13vh,140px)}
.slide.cs.stx .stx-sketch img{max-height:min(11vh,124px)}
.slide.cs.stx .stx-sub{margin-top:2px}
/* ---------- ROLE TABS + LIVE SCREEN RECREATION (mk-*) ---------- */
.rl-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.rl-tab{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:8px 12px 8px 8px;cursor:pointer;font-family:inherit;color:var(--ink-dim);transition:border-color .2s,box-shadow .2s,background .2s}
.rl-tab img{width:46px;height:46px;flex:0 0 46px;object-fit:contain;opacity:.55;transition:opacity .2s}
.rl-tab b{display:block;font-size:clamp(14px,1.25vw,17px);color:var(--ink);line-height:1.15}
.rl-tab span{display:block;font-size:clamp(11px,.9vw,12.5px);line-height:1.3;margin-top:2px}
.rl-tab span i{font-style:normal;font-weight:700;color:var(--ink)}
.rl-tab:hover{border-color:rgba(199,144,6,.55)}
.rl-tab.on{background:#fff;border-color:var(--yellow);box-shadow:0 10px 24px rgba(31,29,24,.1)}
.rl-tab.on img{opacity:1}
.rl-foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.rl-foot .stx-nav{flex:0 0 28px}
.rl-cap{margin:0;font-size:clamp(12.5px,1.05vw,14px);color:var(--ink-dim);line-height:1.4}
.rl-cap b{color:var(--ink)}
.mk-stage{position:relative;width:100%;font-family:'Inter','Noto Sans',sans-serif}
.mk-scale{position:absolute;left:0;top:0;width:1000px;height:700px;transform-origin:0 0;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(31,29,24,.16);border:1px solid #e3e1dc;background:#f5f5f5}
.mk-screen{position:absolute;inset:0;display:none;flex-direction:column;color:#1f2328;font-size:14px;line-height:1.35}
.mk-stage[data-screen="ov"] .mk-ov,.mk-stage[data-screen="ag"] .mk-ag{display:flex}
.mk-top{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(90deg,#3a3e44,#121518);color:#fff}
.mk-brand{font-size:16px;font-weight:500;letter-spacing:.01em}
.mk-ti{display:flex;gap:16px;align-items:center}.mk-ti svg{width:20px;height:20px}
.mk-bell{display:flex;align-items:center;gap:3px}.mk-bell em{font-style:normal;font-size:10px;font-weight:700;background:#d13b3b;border:1.5px solid #fff;border-radius:9px;padding:0 5px;line-height:15px}
.mk-body{flex:1;display:flex;min-height:0}
.mk-nav{width:56px;flex:0 0 56px;background:#fff;border-right:1px solid #e4e4e7;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:14px}
.mk-nav i{width:38px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.mk-nav i svg{width:20px;height:20px;fill:none;stroke:#8a8a90;stroke-width:1.7}
.mk-nav i.on{background:#e8f0fe}.mk-nav i.on svg{stroke:#2563eb}
.mk-main{flex:1;min-width:0;padding:16px 22px;overflow:hidden}
.mk-h1{font-size:22px;font-weight:400;margin-bottom:12px}
.mk-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mk-kpi{background:#fff;border:1.5px solid #e2e2e2;border-radius:8px;padding:12px 14px}
.mk-kpi b{font-size:14px;font-weight:600}.mk-kpi p{margin:0;font-size:13px;color:#555}
.mk-num{font-size:28px;font-weight:400;margin:4px 0 4px;line-height:1.1}.mk-num span{font-size:14px;margin-left:8px;color:#333}
.mk-h2{font-size:17px;margin-bottom:8px}
.mk-filters{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px}
.mk-filters svg{width:14px;height:14px;fill:none;stroke:#666;stroke-width:2;margin-right:6px}
.mk-in,.mk-sel{display:flex;align-items:center;border:1.5px solid #9a9a9a;border-radius:4px;padding:5px 9px;color:#888;background:#fff}
.mk-in{width:150px}.mk-sel.dark{color:#222}.mk-sel em{font-style:normal;margin-left:8px;color:#555}
.mk-link{color:#2557c8;font-weight:600}.mk-dim{color:#444}
.mk-applied{font-size:13px;color:#555;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.mk-tag{background:#e8f0fe;color:#2557c8;font-weight:600;border-radius:999px;padding:3px 10px;font-size:12px}
.mk-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:10px}
.mk-row{display:flex;align-items:center;gap:16px}
.mk-cust{width:190px;flex:0 0 190px}.mk-cust a{display:block;color:#2557c8;font-size:16px;margin-bottom:4px}
.mk-badge{display:inline-flex;align-items:center;gap:6px;background:#f1edfb;border-radius:999px;padding:2px 9px 2px 4px;font-size:12px;font-weight:600}
.mk-badge i{width:13px;height:13px;border-radius:3px;background:#7c5ce0;color:#fff;font-size:9px;font-style:normal;display:flex;align-items:center;justify-content:center}
.mk-col{width:84px;font-size:14px}.mk-col.w{width:150px}.mk-col small{display:block;font-size:12px;color:#666;margin-bottom:3px}
.mk-sp{flex:1}
.mk-btn{margin-left:auto;background:#2f63d8;color:#fff;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:5px;white-space:nowrap}
.mk-chev{color:#555;font-size:16px}
.mk-sum{display:flex;align-items:flex-start;gap:12px;margin-top:10px;padding:11px 14px;border-radius:8px;background:linear-gradient(90deg,#f4f6fc,#fbf4f6)}
.mk-ai{display:inline-flex;width:26px;height:26px;flex:0 0 26px;border-radius:8px;align-items:center;justify-content:center;transition:box-shadow .3s,background .3s}
.mk-ai svg{width:24px;height:24px}.mk-ai.sm{width:22px;height:22px;flex-basis:22px}
.mk-sum p{margin:0;flex:1;font-size:13.5px;line-height:1.45;color:#222}
.mk-acts{display:flex;gap:12px;align-items:center;white-space:nowrap}

/* v4: sketch-only stacked cards */
.kt-steps{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0}
.kt-card{position:relative;width:min(300px,100%);height:clamp(70px,10vh,104px);background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 22px rgba(31,29,24,.10);display:block;overflow:hidden;padding:8px 14px;transform:translateX(var(--x)) rotate(var(--r));transition:transform .25s ease,box-shadow .25s ease;cursor:default}
.kt-card+.kt-card{margin-top:-16px}
.kt-card img{width:100%;height:100%;min-height:0;object-fit:contain;mix-blend-mode:multiply;display:block}
.kt-card:hover{transform:translateX(0) rotate(0) scale(1.14);z-index:5;box-shadow:0 20px 44px rgba(31,29,24,.20)}
@media (max-height:820px){.kt-card{height:76px}}
/* v5: equal portrait-ish cards, zig-zag stack */
.kt-steps{--h:clamp(96px,13.4vh,132px);align-items:center}
.kt-card{width:calc(var(--h)*1.25);height:var(--h);padding:10px;transform:translateX(calc(var(--h)*var(--x)*1.25)) rotate(var(--r))}
.kt-card+.kt-card{margin-top:calc(var(--h)*-0.4)}
.kt-card:nth-child(1){z-index:1}.kt-card:nth-child(2){z-index:2}.kt-card:nth-child(3){z-index:3}.kt-card:nth-child(4){z-index:4}.kt-card:nth-child(5){z-index:5}
.kt-card:hover{z-index:9;transform:translateX(calc(var(--h)*var(--x)*1.25)) rotate(0) scale(1.18)}
@media (max-height:820px){.kt-card{height:var(--h)}}
/* v6: bigger cards, wider spread, breathing room in the middle */
.kt-head,.kt-grid{width:min(1460px,calc(100% - 170px))!important}
.kt-grid{grid-template-columns:minmax(320px,400px) 1fr minmax(270px,330px)!important;gap:clamp(40px,5vw,100px)!important}
.kt-steps{--h:clamp(104px,15.6vh,166px);align-items:flex-start}
.kt-card{width:calc(var(--h)*1.42)}
.kt-card+.kt-card{margin-top:calc(var(--h)*-0.5)}

.kt-card:hover{transform:translateX(calc(var(--h)*(var(--x) + .32)*1.3)) rotate(0) scale(1.15)}
.kt-mid{padding:0 clamp(12px,2vw,36px)}
.kt-prin{justify-self:end}

.kt-steps{--h:clamp(96px,14.6vh,150px);display:grid!important;grid-template-columns:repeat(2,calc(var(--h)*1.38));grid-auto-rows:calc(var(--h)/2 - 4px);column-gap:14px;row-gap:8px;padding:4px 0!important}

.kt-card:nth-child(5){grid-column:1;grid-row:5/7;--r:-1deg}
.kt-card:hover{transform:rotate(0) scale(1.12)!important;z-index:9}

/* ---------- FRAMEWORK: Product Trust Framework (adapted from Google PAI Guidebook) ---------- */
{h:'raw', cls:'fw', notes:"So how do you do this on purpose? Here is a framework, adapted from Google's People plus AI Guidebook. Trust is not something you maximize, it is something you calibrate. Four states: too little trust, uncertainty, calibrated trust, and too much trust. Two of them are failures. Too little trust: people doubt a correct answer. Too much trust: people believe a wrong one. The goal is the green one — trust that matches actual capability. The framework walks five stages. One, define the AI's role — assistant, coach, collaborator — the label sets the expectation contract. Two, find your critical moments — first contact, high stakes, error recovery — and pick the three to five principles that matter there, from things like authenticity, competence, transparency. Three, design trust in — explanations at the right level for each audience, approval gates before consequential actions. Four, calibrate — audit for over-trust and under-trust edge cases; remember uncertainty needs explanation, distrust needs a product re-think. Five, measure both directions — confidence in wrong answers is as dangerous as doubt in right ones. Under and over trust both fail. Calibrated trust is the only win.",
 html:`
  <h2 class="display">Calibrate trust <span style="color:var(--yellow)">for your product</span></h2>
  <div class="fw-scale-wrap">
    <img class="fw-scale-img" src="trust-scale-calibrate-v2.jpg" alt="Hand-drawn trust scale: a horizontal line running from a gray dashed segment labeled UNDER TRUST, through a yellow dot marked CALIBRATE, to an orange dashed segment labeled OVER TRUST, with a sketch of three people comparing notes around a table below">
    <svg class="fw-scale-map" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
      <line class="fw-leader l-lo" x1="20.9" y1="1" x2="-11.8" y2="39" vector-effect="non-scaling-stroke"/>
      <line class="fw-leader l-un" x1="36.6" y1="1" x2="29.3" y2="39" vector-effect="non-scaling-stroke"/>
      <line class="fw-leader l-ok" x1="45.7" y1="1" x2="70.7" y2="39" vector-effect="non-scaling-stroke"/>
      <line class="fw-leader l-hi" x1="74.8" y1="1" x2="111.8" y2="39" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <div class="fw-spectrum" role="list" aria-label="The trust spectrum: four states mapped on the trust scale">
    <div class="fw-state lo" role="listitem">
      <div class="st">Under-trust</div>
      <div class="sd">Correct output, user doubts it. Value missed, product abandoned.</div>
      <span class="fx">→ provenance + explanation</span>
    </div>
    <div class="fw-state un" role="listitem">
      <div class="st">Uncertainty</div>

{h:'steps5', eyebrow:'Five steps', t:'Five steps to calibrate trust',

{h:'raw', cls:'cs', notes:"Remember the ten questions. For each one, we built a component you can use. Capability: Action Plan shows it understood the job before it starts. Reliability: before anything final, you have to confirm. Care: it stops and checks what you need. Honesty: the evidence sits next to the claim. Information and respect: you decide how your data is used. Appropriate confidence: high, medium or low on each claim. Human control: Stop is always there. Recovery: every action is on record, so you can see it and fix it.", html:`
  <div class="eyebrow">Trust components</div>
  <h2 class="display">Every question has a component.</h2>

const root = document.getElementById('slidesRoot');
function esc(s){return s;}

function renderSlide(sl, i){
  let inner = '';
  if(sl.h==='cover'){
    inner = `${sl.eyebrow ? `<div class="eyebrow fx-t">${sl.eyebrow}</div>` : ''}<h1 class="display">${sl.t}</h1>${sl.lede ? `<p class="lede fx">${sl.lede}</p>` : ''}`;
  } else if(sl.h==='closing'){
    inner = `<h1 class="display">${sl.t}</h1>`;
  } else if(sl.h==='media'){
    const delay = sl.imgDelay || 0;
    const clickReveal = sl.imgDelay === null; /* null = click-driven reveal: image first, then headline */
    const single = !sl.img; /* one image, centered, no headline */
    if(single){
      const a = sl.href
        ? `<a class="media-link" href="${sl.href}" target="_blank" rel="noopener" aria-label="${sl.sourceAria || 'Open the source post (opens in a new tab)'}">`
        : '';
      const aEnd = sl.href ? '</a>' : '';
      inner = `<div class="media-row single fx"><figure class="media-fig">${a}<img class="slide-media solo" src="${sl.left}" alt="${sl.alt||''}">${aEnd}</figure>${sl.href ? `<a class="media-source" href="${sl.href}" target="_blank" rel="noopener">${sl.sourceLabel || 'View the source post'} <span class="arr" aria-hidden="true">↗</span></a>` : ''}</div>`;
    } else {
      inner = `<h2 class="display${clickReveal ? ' delayed-text' : ''}">${sl.t}</h2>
        <div class="media-row fx">
          <figure class="media-fig">
            <img class="slide-media" src="${sl.left}" alt="${sl.leftAlt || ''}">
            ${sl.credit ? `<figcaption class="media-credit">${sl.credit}</figcaption>` : ''}
          </figure>
          <img class="slide-media${clickReveal ? ' delayed-media' : ''}" src="${sl.img}" alt="${sl.alt||''}">
        </div>
        ${sl.caption ? `<div class="media-caption fx2">${sl.caption.map(l=>`<span class="cap-line">${l}</span>`).join('')}</div>` : ''}`;
    }
  } else if(sl.h==='media-pair'){
    const chips = sl.chips || [];
    const cardMap = sl.cardMap || [];
    inner = `<h2 class="display">${sl.t}</h2>
      <p class="lede pair-sub">${sl.sub || ''}</p>
      <div class="media-row">
        ${sl.imgs.map((m,k)=>`<figure class="media-fig" data-fig="${k+1}">
          <div class="imgwrap">

/* dot navigator tooltip: instant styled chip on hover/focus (native title is slow + unstyled).
   Label = slide headline (tags stripped) -> sub -> media alt -> 'Slide N'. */
const tickTip = document.getElementById('tickTip');
const stripTags = (h)=>String(h||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const tickLabel = (s)=>stripTags(s.t) || stripTags(s.sub) || stripTags(s.alt) || `Slide`;
function showTickTip(tick){
  const i = [...ticksEl.children].indexOf(tick);
  tickTip.textContent = `${String(i+1).padStart(2,'0')} — ${tickLabel(SLIDES[i])}`;
  const r = tick.getBoundingClientRect();
  tickTip.style.left = Math.min(Math.max(r.left + r.width/2, 90), window.innerWidth-90) + 'px';
  tickTip.setAttribute('aria-hidden','false');

function hideTickTip(){ tickTip.classList.remove('show'); tickTip.setAttribute('aria-hidden','true'); }

ticksEl.addEventListener('mouseout', e=>{ if(e.target.closest('.tick')) hideTickTip(); });
ticksEl.addEventListener('focusin', e=>{ const t=e.target.closest('.tick'); if(t) showTickTip(t); });
ticksEl.addEventListener('focusout', e=>{ if(e.target.closest('.tick')) hideTickTip(); });
function updateProgress(){
  const ticks = ticksEl.children;

let imgTimer = null;
let fadeTimer = null;
/* Click-advance reveal: a slide can hold steps (delayed image, then delayed text).
   Advancing past a slide that still has hidden steps consumes the click to reveal
   the next step (image first, then text); only a fully-revealed slide lets the
   click through to the next slide. Arriving on any slide resets its steps. */
function revealNext(sec){
  if(sec && sec.__stepNext && sec.__stepNext()) return true;
  const img = sec.querySelector('img.delayed-media:not(.revealed)');
  if(img){ img.classList.add('revealed'); return true; }
  const txt = sec.querySelector('h2.display.delayed-text:not(.revealed)');
  if(txt){ txt.classList.add('revealed'); return true; }
  const step = sec.querySelector('.chain .step.pending');
  if(step){ step.classList.remove('pending'); step.classList.add('in');
    const idx = +step.dataset.step;
    const punch = sec.querySelector('#chain-punch');
    if(punch && idx >= sec.querySelectorAll('.chain .step').length){ punch.classList.add('show'); }
    /* cards do NOT auto-open: each stays hidden until its hotspot is clicked */
    return true; }
  const pend = [...sec.querySelectorAll('.map-card.pending, .map-pin.pending')]
    .sort((a,b)=>(+a.dataset.step)-(+b.dataset.step))[0];
  if(pend && sec.classList.contains('summap')){
    pend.classList.remove('pending'); pend.classList.add('in');
    const arcs = sec.querySelectorAll('.arc');
    /* hub first (lights the map), then the news row left-to-right; each incident
       thickens its own arc, JUN also lights the Australia pin, Monitor fires the punch */
    if(pend.classList.contains('hub')){ arcs.forEach(a=>a.classList.add('in')); }
    if(pend.dataset.arc!==undefined){ const a = arcs[+pend.dataset.arc]; if(a) a.classList.add('major'); }
    if(pend.classList.contains('monitor')){
      const punch = sec.querySelector('#map-punch'); if(punch) punch.classList.add('show'); }
    return true; }
  /* framework slide: scale image always visible; each click maps the next state card
     to the scale (leader lines light up together with the first card) */
  if(sec.classList.contains('fw')){
    const state = sec.querySelector('.fw-state:not(.in)');
    if(state){
      sec.classList.add('fw-scale-ready');
      state.classList.add('in');
      return true; }
    return false; }
  /* five-steps carousel: each click brings the next sketch out at center */
  if(sec.classList.contains('steps5')){
    const next = sec.querySelector('.s5-card:not(.in)');
    if(next){
      const N = sec.querySelectorAll('.s5-card').length;
      const k = +next.dataset.i;
      sec.querySelectorAll('.s5-card.in').forEach(c=>{
        const j = +c.dataset.i;
        let d = ((k - j) % N + N) % N;          /* 0..4 steps behind the newest */
        /* ring slots: 1-2 behind trail LEFT, 3-4 behind wrap to the RIGHT
           (nearest-distance ring: 4 behind = right-near, 3 behind = right-far) */
        const pos = d===0 ? 'pos-c' : d===1 ? 'pos-l1' : d===2 ? 'pos-l2' : d===3 ? 'pos-r2' : 'pos-r1';
        c.classList.remove('pos-c','pos-l1','pos-l2','pos-r1','pos-r2');
        c.classList.add(pos);
      });
      next.classList.add('in','pos-c');
      return true; }
    return false; }
  const ppanel = sec.querySelector('.panel:not(.in)');
  if(ppanel){
    ppanel.classList.add('in');
    if(!sec.querySelector('.panel:not(.in)')){
      const punch = sec.querySelector('#pat-punch'); if(punch) punch.classList.add('show'); }
    return true; }
  return false;
}
function resetSteps(sec){
  if(sec && sec.__stepReset) sec.__stepReset();
  sec.querySelectorAll('img.delayed-media.revealed, h2.display.delayed-text.revealed')
    .forEach(el=>el.classList.remove('revealed'));
  sec.querySelectorAll('.chain .step.in').forEach(el=>{el.classList.add('pending');el.classList.remove('in');});
  chainClearAll(sec);
  const punch = sec.querySelector('#chain-punch');
  if(punch) punch.classList.remove('show');
  const mapPunch = sec.querySelector('#map-punch');
  if(mapPunch) mapPunch.classList.remove('show');
  sec.querySelectorAll('.summap .map-card.in, .summap .map-pin.in').forEach(el=>{el.classList.add('pending');el.classList.remove('in');});
  sec.querySelectorAll('.summap .arc.major').forEach(a=>a.classList.remove('major'));
  sec.querySelectorAll('.summap .arc.in').forEach(a=>a.classList.remove('in'));
  /* framework slide: hide the mapped state cards + leader lines again */
  sec.classList.remove('fw-scale-ready');
  sec.querySelectorAll('.fw-state.in').forEach(el=>el.classList.remove('in'));
  /* five-steps carousel: hide the cards again for a fresh ring on re-entry */
  sec.querySelectorAll('.s5-card.in').forEach(el=>{el.classList.remove('in','pos-c','pos-l1','pos-l2','pos-r1','pos-r2');});
  /* patterns slide: hide panels + punch + any open cards */
  sec.querySelectorAll('.panel.in').forEach(el=>el.classList.remove('in'));
  const patPunch = sec.querySelector('#pat-punch');
  if(patPunch) patPunch.classList.remove('show');
  sec.querySelectorAll('.link-card.show').forEach(el=>{el.classList.remove('show');el.hidden=true;});
  sec.querySelectorAll('.chip[aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false'));
}
function go(i){
  if(i<0||i>=SLIDES.length) return;
  if(imgTimer){ clearTimeout(imgTimer); imgTimer = null; }
  if(i > cur && revealNext(root.children[cur])) return; /* click reveals a step on the current slide */
  const sec = root.children[i];
  const prev = root.children[cur];
  document.querySelectorAll('.slide.leaving').forEach(s=>{s.classList.remove('leaving');s.classList.remove('active');});
  if(prev !== sec){
    prev.classList.remove('active');
    prev.classList.add('leaving');
    if(fadeTimer){ clearTimeout(fadeTimer); }
    fadeTimer = setTimeout(()=>{ prev.classList.remove('leaving'); }, 450);
  }
  resetSteps(sec);
  sec.classList.add('active');
  sec.scrollTop = 0;
  cur = i;
  document.getElementById('talk-title').style.display = (i === 0) ? 'none' : '';
  localStorage.setItem('trust-cur', String(cur));
  updateProgress();
  sizeAnnoCanvas(i);
}

const state = {
  mode:false, tool:'pen', color:'#C79006', size:5,
  drawing:false, cur:null, preview:null
};
const annoKey = i => `trust-anno-${i}`;
let strokes = {};  // per-slide arrays, lazily loaded

function loadStrokes(i){
  if(!(i in strokes)){
    try { strokes[i] = JSON.parse(localStorage.getItem(annoKey(i))||'[]'); }
    catch(e){ strokes[i] = []; }
  }
  return strokes[i];
}
function saveStrokes(i){
  try { localStorage.setItem(annoKey(i), JSON.stringify(strokes[i]||[])); } catch(e){}
}
function activeCanvas(){ return root.children[cur].querySelector('.anno-canvas'); }

function sizeAnnoCanvas(i){
  const sec = root.children[i], cv = sec.querySelector('.anno-canvas');
  const w = Math.max(sec.scrollWidth, sec.clientWidth);
  const h = Math.max(sec.scrollHeight, sec.clientHeight);
  const dpr = window.devicePixelRatio||1;
  if(cv.width !== w*dpr || cv.height !== h*dpr){
    cv.width = w*dpr; cv.height = h*dpr;
    cv.style.width = w+'px'; cv.style.height = h+'px';
  }
  redraw(i);
}
function ctxFor(i){
  const cv = root.children[i].querySelector('.anno-canvas');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  return {ctx, cv};
}
function drawStroke(ctx, st){
  ctx.globalAlpha = st.tool==='pen' ? .92 : 1;
  ctx.strokeStyle = st.color; ctx.fillStyle = st.color;
  ctx.lineWidth = st.size;
  if(st.tool==='pen'){
    ctx.beginPath();
    const p = st.pts;
    ctx.moveTo(p[0],p[1]);
    if(p.length<4){ ctx.lineTo(p[2]||p[0]+1, p[3]||p[1]+1); }
    else for(let k=2;k<p.length-2;k+=2){
      ctx.quadraticCurveTo(p[k],p[k+1],(p[k]+p[k+2])/2,(p[k+1]+p[k+3])/2);
    }
    ctx.stroke();
  } else if(st.tool==='arrow'){
    const [x1,y1,x2,y2]=st.pts;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a = Math.atan2(y2-y1,x2-x1), hl = Math.max(10, st.size*3.2);
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hl*Math.cos(a-.45), y2-hl*Math.sin(a-.45));
    ctx.lineTo(x2-hl*Math.cos(a+.45), y2-hl*Math.sin(a+.45));
    ctx.closePath(); ctx.fill();
  } else if(st.tool==='rect'){
    const [x1,y1,x2,y2]=st.pts;
    ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
  } else if(st.tool==='ellipse'){
    const [x1,y1,x2,y2]=st.pts;
    ctx.beginPath();
    ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function redraw(i){
  const {ctx} = ctxFor(i);
  const cv = root.children[i].querySelector('.anno-canvas');
  const dpr = window.devicePixelRatio||1;
  ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
  loadStrokes(i).forEach(st=>drawStroke(ctx,st));
  if(state.preview && i===cur) drawStroke(ctx, state.preview);
}
function canvasPos(e, cv){
  const r = cv.getBoundingClientRect();
  return [ (e.clientX-r.left), (e.clientY-r.top) ];
}
function hitStroke(x,y,arr){
  const TOL = 10;
  for(let k=arr.length-1;k>=0;k--){
    const st = arr[k];
    if(st.tool==='pen'){
      for(let p=0;p<st.pts.length;p+=2){
        if(Math.hypot(st.pts[p]-x, st.pts[p+1]-y) < TOL + st.size) return k;
      }
    } else {
      const [x1,y1,x2,y2]=st.pts;
      const nx = Math.min(x1,x2), ny = Math.min(y1,y2);
      const w = Math.abs(x2-x1), h = Math.abs(y2-y1);
      if(st.tool==='arrow'){
        // point-segment distance
        const L2 = (x2-x1)**2 + (y2-y1)**2;
        const t = L2 ? Math.max(0,Math.min(1,((x-x1)*(x2-x1)+(y-y1)*(y2-y1))/L2)) : 0;
        if(Math.hypot(x-(x1+t*(x2-x1)), y-(y1+t*(y2-y1))) < TOL+st.size) return k;
      } else {
        const pad = TOL+st.size;
        if(x>=nx-pad && x<=nx+w+pad && y>=ny-pad && y<=ny+h+pad){
          const inner = 4+st.size;
          if(st.tool==='rect' && x>nx+inner && x<nx+w-inner && y>ny+inner && y<ny+h-inner) continue;
          return k;
        }
      }
    }
  }
  return -1;
}
function bindCanvas(i){
  const cv = root.children[i].querySelector('.anno-canvas');
  const down = e=>{
    if(!state.mode) return;
    e.preventDefault();
    const {ctx} = ctxFor(i);
    const [x,y] = canvasPos(e,cv);
    const arr = loadStrokes(i);
    if(state.tool==='eraser'){
      const k = hitStroke(x,y,arr);
      if(k>=0){ arr.splice(k,1); saveStrokes(i); redraw(i); }
      return;
    }
    state.drawing = true;
    state.preview = {tool:state.tool,color:state.color,size:state.size,pts:[x,y,x,y]};
    try { cv.setPointerCapture(e.pointerId); } catch(err) {}
  };
  const move = e=>{
    if(!state.drawing) return;
    const [x,y] = canvasPos(e,cv);
    const p = state.preview;
    if(p.tool==='pen'){
      p.pts.push(x,y);
      if(p.pts.length>4) redrawNoPreview(i), drawStroke(ctxFor(i).ctx,p);
      else redraw(i);
    } else { p.pts[2]=x; p.pts[3]=y; redraw(i); }
  };
  const up = e=>{
    if(!state.drawing) return;
    state.drawing = false;
    const p = state.preview; state.preview = null;
    if(p){
      const moved = p.tool!=='pen' ? (Math.abs(p.pts[0]-p.pts[2])+Math.abs(p.pts[1]-p.pts[3])>4) : p.pts.length>2;
      if(moved){ loadStrokes(i).push(p); saveStrokes(i); }
    }
    redraw(i);
  };
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
}
function redrawNoPreview(i){
  const {ctx} = ctxFor(i);
  const cv = root.children[i].querySelector('.anno-canvas');
  const dpr = window.devicePixelRatio||1;
  ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
  loadStrokes(i).forEach(st=>drawStroke(ctx,st));
}

const S8NS = 'http://www.w3.org/2000/svg';
const s8Stage = document.getElementById('stage');
const s8Svg = document.createElementNS(S8NS,'svg');
s8Svg.id = 'wires8'; s8Svg.setAttribute('aria-hidden','true');

function s8ClearWire(n){ const g = s8Svg.querySelector(`g[data-n="${n}"]`); if(g) g.remove(); }

function s8Wire(start, end, n){
  const g = document.createElementNS(S8NS,'g'); g.dataset.n = n;
  /* high arch: out of the card's bottom corner, over the photo, down onto the chip */
  const midX = (start.x + end.x)/2;
  const archY = Math.min(start.y, end.y) - 56;
  const d = `M ${start.x} ${start.y} C ${start.x} ${start.y - 70}, ${midX} ${archY}, ${end.x} ${Math.max(archY + 40, end.y - (end.y - archY) * 0.4)} S ${end.x} ${end.y}, ${end.x} ${end.y}`;
  const halo = document.createElementNS(S8NS,'path');
  halo.setAttribute('d', d); halo.setAttribute('class','halo');
  const main = document.createElementNS(S8NS,'path');
  main.setAttribute('d', d); main.setAttribute('class','main');
  const dot = document.createElementNS(S8NS,'circle');
  dot.setAttribute('cx', end.x); dot.setAttribute('cy', end.y); dot.setAttribute('r', 5.5);
  dot.setAttribute('class','dot');
  g.appendChild(halo); g.appendChild(main); g.appendChild(dot);
  s8Svg.appendChild(g);
  if(!s8Reduce){
    const len = main.getTotalLength();
    halo.style.strokeDasharray = len;
    main.style.strokeDasharray = '2 9';
    main.style.strokeDashoffset = 0;
    halo.style.strokeDashoffset = len;
    halo.style.transition = 'stroke-dashoffset .5s ease-out';
    main.style.transition = 'none';
    /* halo sweeps in first, dotted line appears on top of it */
    setTimeout(()=>{
      halo.style.strokeDasharray = 'none';
      main.style.transition = 'opacity .3s ease';
      main.style.opacity = 0;
      requestAnimationFrame(()=>{ main.style.opacity = 1; });
    }, 520);
    dot.style.opacity = 0;
    dot.style.transition = 'opacity .25s ease .65s';
    requestAnimationFrame(()=>{ dot.style.opacity = 1; });
  }
  return g;
}

function s8PlaceAndWire(btn, card, fig){
  s8ClearWire(fig.dataset.fig);
  const CARD_W = 310;
  const bw = btn.getBoundingClientRect(), br = fig.getBoundingClientRect(), sr = s8Stage.getBoundingClientRect();
  const wrap = fig.querySelector('.imgwrap');
  const isLeft = fig.dataset.fig === '1';
  let left = isLeft ? -40 : wrap.clientWidth - CARD_W + 40;
  left = Math.max(12 - br.left, Math.min(innerWidth - CARD_W - 12 - br.left, left));
  card.style.left = left + 'px';
  card.style.top = '-30px'; /* floats half-over the photo's top-outer corner */
  const start = {x: bw.x + bw.width/2 - sr.left, y: bw.y + bw.height/2 - sr.top};
  const cr = card.getBoundingClientRect();
  /* leave the card from its bottom-inner corner, land on the chip */
  const end = {x: cr.x + (isLeft ? cr.width - 30 : 30) - sr.left, y: cr.y + cr.height - sr.top - 6};
  s8Wire(start, end, fig.dataset.fig);
}

/* ---------- SLIDE 9: framework cards mapped onto the failure chain ---------- */
/* click-to-open reflection cards: each mapped tile gets a yellow ? hotspot;
   clicking it floats the card beside the tile (no connector wires) */
const chainSec = () => document.querySelector('.slide.chain-slide');
const chReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function chainClearAll(){
  document.querySelectorAll('.link-card.chain-card').forEach(card=>{
    card.classList.remove('show'); card.hidden = true; });

function chainPlace(hotspot, card){
  /* tile cards float beside their tile, clamped inside the browser window
     (below the fixed top bar at 52px, above the bottom toolbar); prefer the
     right side, fall back to the left when there is no room.
     clamped synchronously from the card's own offset size — a rAF-based clamp
     never fires in an idle headless tab and can race live layout too */
  const cardW = card.offsetWidth || Math.min(300, innerWidth * .42);
  const cardH = card.offsetHeight || 200;
  const hr = hotspot.getBoundingClientRect();
  const rightSpot = hr.right + 26, leftSpot = hr.left - cardW - 26;
  let left = (rightSpot + cardW <= innerWidth - 24 ? rightSpot : Math.max(12, leftSpot));
  left = Math.min(Math.max(12, left), Math.max(12, innerWidth - cardW - 24));
  let top = Math.max(64, hr.bottom - 42);
  top = Math.min(Math.max(64, top), Math.max(64, innerHeight - cardH - 96));
  /* the card's containing block may be any transformed ancestor (a .step tile with
     rotate(.6deg), or none at all once hoisted to the slide-level pen) — set viewport
     coords, measure where they actually landed, and correct the constant offset */
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  const dr = card.getBoundingClientRect();
  card.style.left = (left + (left - dr.left)) + 'px';
  card.style.top = (top + (top - dr.top)) + 'px';
}

function chainCardIn(sec, key){
  const card = sec.querySelector('#ccard'+key);
  const hotspot = sec.querySelector(`.hotspot[data-chcard="${key}"]`);
  if(!card || !hotspot) return;
  card.hidden = false;
  /* one card open at a time on this slide keeps the stage clean */
  sec.querySelectorAll('.link-card.chain-card.show').forEach(other=>{
    if(other !== card){
      other.classList.remove('show'); other.hidden = true;
      const h = sec.querySelector(`.hotspot[data-chcard="${other.id.replace('ccard','')}"]`);
      if(h) h.setAttribute('aria-expanded','false');
    }
  });
  /* hoist the card out of its tile: each revealed tile is its own stacking context
     (transform), so an in-tile card paints UNDER later steps — the slide-level pen
     is painted after the tile row, putting the open card on top of every step */
  const pen = sec.querySelector('.chain-pen');
  if(pen && card.parentElement !== pen) pen.appendChild(card);
  requestAnimationFrame(()=>{
    card.classList.add('show');
    hotspot.setAttribute('aria-expanded','true');
    setTimeout(()=>{ chainPlace(hotspot, card); }, chReduce ? 30 : 210);
  });
}
function chainToggle(sec, key){
  const card = sec.querySelector('#ccard'+key);
  if(!card) return;
  if(card.classList.contains('show')){
    card.classList.remove('show'); card.classList.add('hide-down');
    setTimeout(()=>{ if(!card.classList.contains('show')) card.hidden = true; }, 260);
    const hotspot = sec.querySelector(`.hotspot[data-chcard="${key}"]`);
    if(hotspot) hotspot.setAttribute('aria-expanded','false');
  } else {
    chainCardIn(sec, key);
  }
}

   the hotspot only appears once its step has been revealed */
document.addEventListener('click', e=>{

    const sec = hotspot.closest('.slide');
    if(step && !step.classList.contains('in')) return; /* not revealed yet */
    chainToggle(sec, hotspot.dataset.chcard);
    return;
  }
});

addEventListener('resize', ()=>{

function patToggleCard(sec, key){
  const card = sec.querySelector('#pcard'+CSS.escape(key));

    card.hidden = false;

    chip.setAttribute('aria-expanded','true');

function patCloseAll(sec){
  sec.querySelectorAll('.link-card.show').forEach(card=>{
    card.classList.remove('show'); card.hidden = true; });

/* chip click toggles its card. Chips arm 250ms after the slide becomes active, so
   the same click that flips onto the slide can never pop a card open by accident. */
let patChipsArmed = false, patArmTimer = null;
document.addEventListener('click', e=>{
  const closeBtn = e.target.closest('[data-pclose]');
  if(closeBtn){ patToggleCard(curSlideSec(), closeBtn.dataset.pclose); return; }
  if(e.target.closest('.patterns .link-card')) return;
  const chip = e.target.closest('.patterns .chip');
  if(chip && patChipsArmed){ patToggleCard(chip.closest('.slide'), chip.dataset.pcard); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('chip')){

const _patArmObs = new MutationObserver(()=>{
  const sec = curSlideSec();
  if(sec && sec.classList.contains('patterns')){
    clearTimeout(patArmTimer);
    patChipsArmed = false;
    patArmTimer = setTimeout(()=>{ patChipsArmed = true; }, 250);
  }
});
_patArmObs.observe(root, {subtree:true, attributes:true, attributeFilter:['class']});
/* teardown on navigation is handled in the existing go() wrapper below (patterns branch) */

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(e.target && e.target.matches && e.target.matches('input,textarea')) return;
  const mod = e.metaKey||e.ctrlKey;
  if(mod && e.key.toLowerCase()==='z'){
    if(state.mode){ e.preventDefault(); document.getElementById('btnUndo').click(); }
    return;
  }
  if(e.key==='Escape'){ if(cardsOpen){ setCards(false); return; } s8CloseAll(); chainCloseAll(); const _ps = curSlideSec(); if(_ps && _ps.classList.contains('patterns')) patCloseAll(_ps); if(state.mode) setMode(false); return; }
  if(cardsOpen) return; /* cards mode owns the keyboard: no slide flips underneath */
  if(e.key.toLowerCase()==='v' && !mod && !state.mode){ e.preventDefault(); setCards(true); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!state.mode)){ e.preventDefault(); go(cur+1); return; }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); return; }
  if(e.key==='Home'){ go(0); return; }
  if(e.key==='End'){ go(SLIDES.length-1); return; }
  if(state.mode){
    const map = {p:'pen',a:'arrow',r:'rect',c:'ellipse',e:'eraser'};
    const t = map[e.key.toLowerCase()];
    if(t){ document.querySelector(`.tool[data-tool="${t}"]`).click(); }
  }
});

/* ---------- boot ---------- */
go(cur);

(function(){

  }

<script>
/* Ten questions: steps through each principle when the slide opens. Click a row to pick one. */
(function(){
  const box=document.querySelector('.qs');if(!box)return;
  const slide=box.closest('.slide'),rows=[...box.querySelectorAll('.qr')],as=[...box.querySelectorAll('.qa')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=null,cur=0;
  const show=i=>{cur=i;rows.forEach((r,k)=>r.classList.toggle('on',k===i));as.forEach((a,k)=>a.classList.toggle('on',k===i));};

      const inner=sec.querySelector('.slide-inner'); if(!inner||!inner.clientWidth) return;
      const col=inner.clientWidth-380-56-90, top=st.getBoundingClientRect().top||230;
      const maxH=Math.max(280,Math.min(window.innerHeight-300,window.innerHeight-top-112));
      s=Math.min(col/W,maxH/H,1.2); sc.style.transform='scale('+s+')';
      st.style.width=(W*s)+'px'; st.style.height=(H*s)+'px'; sec.style.setProperty('--stw',(W*s)+'px'); draw();
    }
    const SEQ=()=>{ const q=[]; Object.keys(cfg).forEach(r=>Object.keys(cfg[r]).sort((x,y)=>x-y).forEach(n=>q.push([r,+n]))); return q; };
    sec.__stepNext=()=>{
      if(!sec.classList.contains('active')) return false;
      if(mode==='roles'){ const q=SEQ();
        if(!a){ const k0=q.findIndex(([r])=>r===role); role=q[k0][0]; select(q[k0][1]); return true; }
        const k=q.findIndex(([r,n])=>r===role&&n===a); if(k<q.length-1){ const [r,n]=q[k+1]; if(r!==role){ role=r; a=0; screens(); } select(n); return true; } return false; }
      if(a<items.length){ select(a+1); return true; } return false;
    };
    sec.__stepPrev=()=>{
      if(!sec.classList.contains('active')||!a) return false;
      if(mode==='roles'){ const q=SEQ(), k=q.findIndex(([r,n])=>r===role&&n===a);
        if(k<=0){ select(0); return true; } const [r,n]=q[k-1]; if(r!==role){ role=r; a=0; screens(); } select(n); return true; }
      select(a-1); return true;
    };
    sec.__stepReset=()=>{ view=1; if(mode==='roles') setRole(Object.keys(cfg)[0]); else select(0); };
    new ResizeObserver(fit).observe(sec.querySelector('.slide-inner')); window.addEventListener('resize',fit);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
    if(mode==='roles') band.style.display='none'; if(mode==='roles') setRole(role); else select(0); fit();
  });
})();

</script>
